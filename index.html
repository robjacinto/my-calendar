<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monthly Work Calendar</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .calendar-header h1 {
            margin: 0;
            font-size: 28px;
        }

        button {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .nav-btn {
            background: #333;
            color: white;
        }

        .nav-btn:hover {
            background: #555;
        }

        .calendar {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        .weekdays,
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
        }

        .weekday {
            padding: 15px;
            text-align: center;
            font-weight: bold;
            background: #343a40;
            color: white;
        }

        .day {
            min-height: 120px;
            border: 1px solid #e5e5e5;
            padding: 10px;
            cursor: pointer;
            position: relative;
            transition: 0.2s;
        }

        .day:hover {
            background: #f0f7ff;
        }

        .day.empty {
            background: #f8f8f8;
            cursor: default;
        }

        .day-number {
            font-weight: bold;
            font-size: 16px;
        }

        .today {
            border: 3px solid #007bff;
        }

        .status {
            margin-top: 12px;
            padding: 6px;
            border-radius: 5px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        /* Status colors */

        .status-RTO {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .status-WFH {
            background: #dcfce7;
            color: #15803d;
        }

        .status-HOLIDAY {
            background: #fef3c7;
            color: #b45309;
        }

        .status-LEAVE {
            background: #fee2e2;
            color: #b91c1c;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
        }

        .rto {
            background: #dbeafe;
        }

        .wfh {
            background: #dcfce7;
        }

        .holiday {
            background: #fef3c7;
        }

        .leave {
            background: #fee2e2;
        }

        /* Modal */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            margin-top: 0;
        }

        .status-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
            color: white;
        }

        .btn-rto {
            background: #2563eb;
        }

        .btn-wfh {
            background: #16a34a;
        }

        .btn-holiday {
            background: #d97706;
        }

        .btn-leave {
            background: #dc2626;
        }

        .btn-clear {
            background: #6b7280;
        }

        .close-btn {
            width: 100%;
            margin-top: 10px;
            background: #eee;
        }

        @media (max-width: 700px) {
            .day {
                min-height: 80px;
                padding: 5px;
            }

            .status {
                font-size: 10px;
                padding: 4px;
            }

            .weekday {
                padding: 10px 2px;
                font-size: 12px;
            }
        }
        .export-btn {
    background: #198754;
    color: white;
    margin-left: 10px;
}

.export-btn:hover {
    background: #146c43;
}
.export-section{
    display: flex;
    justify-content: flex-end;
    margin-bottom: 15px;
}
    </style>
</head>

<body>

<div class="container">

    <div class="calendar-header">

        <button class="nav-btn" onclick="previousMonth()">
            ← Previous
        </button>

        <h1 id="monthYear"></h1>

        <button class="nav-btn" onclick="nextMonth()">
            Next →
        </button>

    </div>
    <div class="calendar">

        <div class="weekdays">
            <div class="weekday">Sun</div>
            <div class="weekday">Mon</div>
            <div class="weekday">Tue</div>
            <div class="weekday">Wed</div>
            <div class="weekday">Thu</div>
            <div class="weekday">Fri</div>
            <div class="weekday">Sat</div>
        </div>

        <div id="days" class="days"></div>

    </div>

    <div class="legend">

        <div class="legend-item">
            <div class="legend-color rto"></div>
            RTO
        </div>

        <div class="legend-item">
            <div class="legend-color wfh"></div>
            WFH
        </div>

        <div class="legend-item">
            <div class="legend-color holiday"></div>
            Holiday
        </div>

        <div class="legend-item">
            <div class="legend-color leave"></div>
            Leave
        </div>

    </div>

<div class="export-section">
    
<button class="export-btn" onclick="exportCSV()">
    Export CSV
</button>

</div>
</div>


<!-- Modal -->

<div id="statusModal" class="modal">

    <div class="modal-content">

        <h2 id="selectedDate"></h2>

        <button
            class="status-btn btn-rto"
            onclick="setStatus('RTO')">
            RTO
        </button>

        <button
            class="status-btn btn-wfh"
            onclick="setStatus('WFH')">
            WFH
        </button>

        <button
            class="status-btn btn-holiday"
            onclick="setStatus('HOLIDAY')">
            HOLIDAY
        </button>

        <button
            class="status-btn btn-leave"
            onclick="setStatus('LEAVE')">
            LEAVE
        </button>

        <button
            class="status-btn btn-clear"
            onclick="clearStatus()">
            Clear
        </button>

        <button
            class="close-btn"
            onclick="closeModal()">
            Cancel
        </button>

    </div>

</div>


<script>

    let currentDate = new Date();

    let selectedDate = null;

    /*
        Store calendar data.

        Example:

        {
            "2026-10-01": "RTO",
            "2026-10-02": "WFH",
            "2026-10-05": "LEAVE"
        }
    */

    let calendarData =
        JSON.parse(localStorage.getItem("workCalendar")) || {};


    function renderCalendar() {

        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        const monthYear =
            document.getElementById("monthYear");

        const daysContainer =
            document.getElementById("days");

        const monthName =
            currentDate.toLocaleString("default", {
                month: "long"
            });

        monthYear.textContent =
            `${monthName} ${year}`;


        daysContainer.innerHTML = "";


        /*
            First day of the month

            0 = Sunday
            1 = Monday
            ...
            6 = Saturday
        */

        const firstDay =
            new Date(year, month, 1).getDay();


        // Number of days in current month

        const daysInMonth =
            new Date(year, month + 1, 0).getDate();


        // Empty cells before first day

        for (let i = 0; i < firstDay; i++) {

            const emptyCell =
                document.createElement("div");

            emptyCell.className = "day empty";

            daysContainer.appendChild(emptyCell);
        }


        // Create days

        for (let day = 1; day <= daysInMonth; day++) {

    const cell = document.createElement("div");

    cell.className = "day";

    const date = new Date(year, month, day);
    const dayOfWeek = date.getDay();

    // Sunday = 0
    // Saturday = 6

    if (dayOfWeek === 0 || dayOfWeek === 6) {
        cell.classList.add("disabled");
    }

    const dateKey =
        `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

    const dayNumber =
        document.createElement("div");

    dayNumber.className = "day-number";

    dayNumber.textContent = day;

    cell.appendChild(dayNumber);


    // Existing status

    if (calendarData[dateKey]) {

        const status =
            document.createElement("div");

        status.className =
            `status status-${calendarData[dateKey]}`;

        status.textContent =
            calendarData[dateKey];

        cell.appendChild(status);
    }


    // Only allow weekdays to be clicked

    if (dayOfWeek !== 0 && dayOfWeek !== 6) {

        cell.addEventListener("click", () => {

            selectedDate = dateKey;

            document.getElementById("selectedDate")
                .textContent = formatDate(dateKey);

            document.getElementById("statusModal")
                .style.display = "flex";

        });

    }


    daysContainer.appendChild(cell);
}

    }


    function formatDate(dateString) {

        const date = new Date(dateString + "T00:00:00");

        return date.toLocaleDateString(
            "default",
            {
                month: "long",
                day: "numeric",
                year: "numeric"
            }
        );

    }


    function setStatus(status) {

        if (!selectedDate) {
            return;
        }


        calendarData[selectedDate] = status;


        saveData();

        closeModal();

        renderCalendar();

    }


    function clearStatus() {

        if (!selectedDate) {
            return;
        }


        delete calendarData[selectedDate];


        saveData();

        closeModal();

        renderCalendar();

    }


    function saveData() {

        localStorage.setItem(
            "workCalendar",
            JSON.stringify(calendarData)
        );

    }


    function closeModal() {

        document.getElementById("statusModal")
            .style.display = "none";

        selectedDate = null;

    }


    function previousMonth() {

        currentDate.setMonth(
            currentDate.getMonth() - 1
        );

        renderCalendar();

    }


    function nextMonth() {

        currentDate.setMonth(
            currentDate.getMonth() + 1
        );

        renderCalendar();

    }


    // Close modal when clicking outside

    window.addEventListener("click", function(event) {

        const modal =
            document.getElementById("statusModal");

        if (event.target === modal) {
            closeModal();
        }

    });


    // Initial calendar

    renderCalendar();
function exportCSV() {

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthName = currentDate.toLocaleString("default", {
        month: "long"
    });

    let csv = "";

    csv += `Month: ${monthName} ${year}\n`;

    // Monday to Friday only
    csv += "Week,Monday,Tuesday,Wednesday,Thursday,Friday\n";


    const firstDay =
        new Date(year, month, 1).getDay();

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();


    let weekNumber = 1;

    let week = [];


    /*
        Convert Sunday-based getDay():

        Sunday    = 0
        Monday    = 1
        Tuesday   = 2
        Wednesday = 3
        Thursday  = 4
        Friday    = 5
        Saturday  = 6
    */


    // Find the first Monday of the calendar week

    for (let day = 1; day <= daysInMonth; day++) {

        const date = new Date(year, month, day);

        const dayOfWeek = date.getDay();


        // Monday-Friday only

        if (dayOfWeek >= 1 && dayOfWeek <= 5) {

            const dateKey =
                `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

            const status =
                calendarData[dateKey] || "";

            week.push(status);


            // Friday = end of work week

            if (dayOfWeek === 5) {

                csv += `Week ${weekNumber},${week.join(",")}\n`;

                weekNumber++;

                week = [];
            }
        }
    }


    // Add remaining weekdays for the final week

    if (week.length > 0) {

        while (week.length < 5) {
            week.push("");
        }

        csv += `Week ${weekNumber},${week.join(",")}\n`;
    }


    // Create CSV

    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        `work-calendar-${year}-${String(month + 1).padStart(2, "0")}.csv`;


    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
